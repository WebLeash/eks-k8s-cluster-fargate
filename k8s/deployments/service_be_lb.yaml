apiVersion: v1
kind: Service
metadata:
  name: my-backend-app-service
  namespace: staging
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # Optional: Use for Network Load Balancer (NLB)
spec:
  type: LoadBalancer
  selector:
    app: my-backend-app
  ports:
    - protocol: TCP
      port: 80                 # External port
      targetPort: 8001          # Backend container port
