apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  namespace: staging
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # Optional: For Network Load Balancer
spec:
  type: LoadBalancer
  ports:
    - port: 80              # External port
      targetPort: 3000      # Internal container port
      protocol: TCP
  selector:
    app: my-app
