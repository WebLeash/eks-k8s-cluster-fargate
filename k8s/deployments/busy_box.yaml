apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-deployment
  namespace: staging
  labels:
    app: busybox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["sleep", "3600"] # Keeps the container running for 1 hour to allow shell access
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
        tty: true
        stdin: true
