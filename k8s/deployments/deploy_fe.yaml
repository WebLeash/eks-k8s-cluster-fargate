apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: staging
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb" # Use this for Network Load Balancer (NLB) if required
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app-container
        image: git.snowfall.se:4567/snowfall/monorepo/node/emirates-web:728.0.0
        ports:
        - containerPort: 3000
        env:
        - name: ENV_NAME
          value: "staging"
        - name: PORT
          value: "3000"
        - name: BFF_API_BASE_URL
          value: "https://api.skywardsrail.junction.dev"
        - name: PUBLIC_SENTRY_DSN
          value: "https://ef15f1238446cd1d5c38ab2890633241@sentry.snowfall.se/234"
      imagePullSecrets:
        - name: gitlab-registry-secret
